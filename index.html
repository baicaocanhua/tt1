<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoList</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d6dce5;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
      --done: #15803d;
      --shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(180, 35, 24, 0.08), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(720px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid rgba(214, 220, 229, 0.92);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 30px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-title .icon {
      width: 26px;
      height: 26px;
      color: var(--accent);
    }

    .summary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 112px;
      align-self: start;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--accent-strong);
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      background: #f3fffc;
    }

    .content {
      padding: 24px 30px 28px;
    }

    .todo-form {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 12px;
      margin-bottom: 18px;
    }

    .todo-input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      color: var(--text);
      outline: none;
      background: #ffffff;
    }

    .todo-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    .primary-button:hover {
      background: var(--accent-strong);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-button,
    .clear-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      border-radius: 8px;
      padding: 0 12px;
      color: var(--muted);
      background: #f4f6f8;
      border: 1px solid transparent;
    }

    .filter-button:hover,
    .clear-button:hover {
      color: var(--text);
      border-color: var(--line);
      background: #ffffff;
    }

    .filter-button.is-active {
      color: var(--accent-strong);
      border-color: rgba(15, 118, 110, 0.34);
      background: #e6f7f4;
      font-weight: 700;
    }

    .clear-button {
      color: var(--danger);
      background: #fff5f4;
    }

    .clear-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .todo-list {
      min-height: 58px;
      margin: 0;
      padding: 0;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }

    .todo-item {
      display: grid;
      grid-template-columns: 28px 1fr 40px;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 9px 12px 9px 14px;
      border-bottom: 1px solid var(--line);
    }

    .todo-item:last-child {
      border-bottom: 0;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--done);
    }

    .todo-title {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .todo-item.is-completed .todo-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      color: var(--danger);
      background: transparent;
    }

    .delete-button .icon {
      width: 19px;
      height: 19px;
    }

    .delete-button:hover {
      background: #fff0ef;
    }

    .empty-state {
      display: none;
      min-height: 86px;
      padding: 28px 16px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: #fbfcfe;
    }

    .empty-state.is-visible {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    @media (max-width: 560px) {
      body {
        place-items: start center;
        padding: 16px 0;
      }

      .app {
        width: calc(100% - 24px);
      }

      .app-header,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .app-header {
        display: block;
      }

      .summary {
        width: max-content;
        margin-top: 14px;
      }

      .todo-form {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .filters,
      .clear-button {
        width: 100%;
      }

      .filter-button {
        flex: 1 1 86px;
      }
    }
  </style>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-check-square" viewBox="0 0 24 24">
      <path d="M9 11l3 3L22 4"></path>
      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14"></path>
      <path d="M5 12h14"></path>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M8 6h13"></path>
      <path d="M8 12h13"></path>
      <path d="M8 18h13"></path>
      <path d="M3 6h.01"></path>
      <path d="M3 12h.01"></path>
      <path d="M3 18h.01"></path>
    </symbol>
    <symbol id="icon-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"></circle>
    </symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M8.5 12.5l2.5 2.5 4.5-5"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M3 6h18"></path>
      <path d="M8 6V4h8v2"></path>
      <path d="M19 6l-1 14H6L5 6"></path>
      <path d="M10 11v5"></path>
      <path d="M14 11v5"></path>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="M18 6L6 18"></path>
      <path d="M6 6l12 12"></path>
    </symbol>
  </svg>
  <main class="app" aria-labelledby="app-title">
    <header class="app-header">
      <div>
        <h1 id="app-title" class="app-title">
          <svg class="icon" aria-hidden="true"><use href="#icon-check-square"></use></svg>
          <span>TodoList</span>
        </h1>
        <p class="subtitle">记录今天要完成的事情</p>
      </div>
      <div class="summary" data-testid="remaining-count">
        <svg class="icon" aria-hidden="true"><use href="#icon-circle"></use></svg>
        <span class="summary-text">0 项待办</span>
      </div>
    </header>

    <section class="content" aria-label="待办事项">
      <form class="todo-form" data-testid="todo-form">
        <label class="visually-hidden" for="todo-input">新增待办</label>
        <input
          id="todo-input"
          class="todo-input"
          data-testid="todo-input"
          type="text"
          autocomplete="off"
          placeholder="输入待办事项"
        >
        <button class="primary-button" type="submit">
          <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          <span>添加</span>
        </button>
      </form>

      <div class="toolbar" aria-label="待办筛选">
        <div class="filters">
          <button class="filter-button is-active" type="button" data-filter="all">
            <svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>
            <span>全部</span>
          </button>
          <button class="filter-button" type="button" data-filter="active">
            <svg class="icon" aria-hidden="true"><use href="#icon-circle"></use></svg>
            <span>未完成</span>
          </button>
          <button class="filter-button" type="button" data-filter="completed">
            <svg class="icon" aria-hidden="true"><use href="#icon-check-circle"></use></svg>
            <span>已完成</span>
          </button>
        </div>
        <button class="clear-button" type="button" data-testid="clear-completed">
          <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
          <span>清空已完成</span>
        </button>
      </div>

      <ul class="todo-list" data-testid="todo-list" aria-live="polite"></ul>
      <p class="empty-state" data-testid="empty-state">
        <svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>
        <span>没有待办事项</span>
      </p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'codex.todo.items.v1';
    const form = document.querySelector('[data-testid="todo-form"]');
    const input = document.querySelector('[data-testid="todo-input"]');
    const list = document.querySelector('[data-testid="todo-list"]');
    const remainingCount = document.querySelector('[data-testid="remaining-count"]');
    const remainingCountText = remainingCount.querySelector('.summary-text');
    const clearCompletedButton = document.querySelector('[data-testid="clear-completed"]');
    const emptyState = document.querySelector('[data-testid="empty-state"]');
    const filterButtons = document.querySelectorAll('[data-filter]');

    let currentFilter = 'all';
    let todos = loadTodos();

    function loadTodos() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        const parsed = stored ? JSON.parse(stored) : [];

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed
          .filter((todo) => todo && typeof todo.title === 'string')
          .map((todo) => ({
            id: typeof todo.id === 'string' ? todo.id : createId(),
            title: todo.title,
            completed: Boolean(todo.completed),
          }));
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getVisibleTodos() {
      if (currentFilter === 'active') {
        return todos.filter((todo) => !todo.completed);
      }

      if (currentFilter === 'completed') {
        return todos.filter((todo) => todo.completed);
      }

      return todos;
    }

    function addTodo(title) {
      const normalizedTitle = title.trim();

      if (!normalizedTitle) {
        return;
      }

      todos = [
        {
          id: createId(),
          title: normalizedTitle,
          completed: false,
        },
        ...todos,
      ];
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) => (
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      ));
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    function clearCompleted() {
      todos = todos.filter((todo) => !todo.completed);
      saveTodos();
      renderTodos();
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach((button) => {
        button.classList.toggle('is-active', button.dataset.filter === filter);
      });
      renderTodos();
    }

    function renderTodos() {
      const visibleTodos = getVisibleTodos();
      const activeCount = todos.filter((todo) => !todo.completed).length;
      const completedCount = todos.length - activeCount;

      list.innerHTML = '';
      remainingCountText.textContent = `${activeCount} 项待办`;
      clearCompletedButton.disabled = completedCount === 0;

      emptyState.classList.toggle('is-visible', visibleTodos.length === 0);
      list.hidden = visibleTodos.length === 0;

      for (const todo of visibleTodos) {
        const item = document.createElement('li');
        item.className = `todo-item${todo.completed ? ' is-completed' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.className = 'todo-checkbox';
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `标记 ${todo.title} 为完成`);
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const title = document.createElement('span');
        title.className = 'todo-title';
        title.textContent = todo.title;

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-button';
        deleteButton.type = 'button';
        deleteButton.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>`;
        deleteButton.setAttribute('aria-label', `删除 ${todo.title}`);
        deleteButton.addEventListener('click', () => deleteTodo(todo.id));

        item.append(checkbox, title, deleteButton);
        list.append(item);
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      addTodo(input.value);
      input.value = '';
      input.focus();
    });

    clearCompletedButton.addEventListener('click', clearCompleted);

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => setFilter(button.dataset.filter));
    });

    renderTodos();
  </script>
</body>
</html>
